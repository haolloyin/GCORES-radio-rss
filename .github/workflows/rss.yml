name: Update Gcores RSS

on:
  schedule:
    # GitHub 的 cron 使用 UTC；UTC 与北京时间相差整 8 小时，所以整点对整点。
    #
    # 但 GitHub 的定时任务是「尽力而为」：整点是全球负载最高的时候，
    # 排在整点的任务经常被延迟几分钟到几十分钟，负载更高时会被直接丢弃。
    # 因此这里错开整点、每小时尝试 3 次（:13 / :33 / :53），
    # 只要有一次跑成功就行；脚本是幂等的，内容没变化不会产生提交。
    - cron: "13 * * * *"
    - cron: "33 * * * *"
    - cron: "53 * * * *"
  workflow_dispatch:

# 同一时间只跑一个，避免两个任务同时 push 冲突
concurrency:
  group: gcores-rss
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate RSS
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          # chapters 目录要通过公网可访问的地址暴露给播客客户端
          CHAPTERS_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/chapters
          FEED_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: python3 gcores_rss.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: refresh rss $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          git push
